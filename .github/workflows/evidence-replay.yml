#
# Replays the declared recipe on the pull request head and compares the
# result with the evidence bundle committed for that exact revision. A missing
# bundle, a non-reproduced replay or a non-conformant verdict fails the job:
# the developer's local evidence has to survive an independent machine.
name: evidence-replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Replay declared recipe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The pull request head, not the synthetic merge ref: the evidence-only
          # commit protocol reads HEAD and its first parent.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install verified Bun archive
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact Bun revision
        run: test "$(bun --revision)" = '1.4.0-canary.1+57f349f63'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Install the tools the recipe declares (REUSE), so the replay is faithful
        run: uv tool install reuse==6.2.0 && reuse --version
      - run: bun install --frozen-lockfile
      - name: Accept the committed recipe for this run
        run: bun bin/evidence.ts accept --by "ci:${{ github.run_id }}"
      - name: Gate on the recipe (conformant required)
        run: bun bin/evidence.ts gate --json
      - name: Compare with the committed evidence (evidence-only commit protocol)
        run: bun bin/evidence.ts verify --ci --json
